<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperCards</title>
<style>
:root {
  --bg: #f5f3ee; --panel: #ffffff; --ink: #1f1d1a; --muted: #77716a; --line: #e4dfd6;
  --accent: #b4532a; --accent-soft: #f6e7df; --chip: #efece6;
  --quote: #b4532a; --figure: #2f6f8f; --data: #5b7f2e; --idea: #8a5aa8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1918; --panel: #252422; --ink: #ece8e1; --muted: #9a948b; --line: #383632;
          --accent: #e08a5f; --accent-soft: #3d2d24; --chip: #33312d;
          --quote: #e08a5f; --figure: #6db3d6; --data: #9cc56a; --idea: #c39be0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
button { font: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: var(--side, 270px) 1fr; min-height: 100vh; }
.resizer { position: fixed; top: 0; bottom: 0; width: 8px; margin-left: -4px; cursor: col-resize; z-index: 5; }
.resizer:hover, .resizer.drag { background: linear-gradient(90deg, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); opacity: .6; }
body.resizing { cursor: col-resize; user-select: none; }
aside { border-right: 1px solid var(--line); padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
aside h1 { font: 600 18px/1 Georgia, "Songti SC", serif; margin: 0 0 18px; letter-spacing: .3px; }
aside h1 span { color: var(--accent); }
aside h2 .clear { float: right; border: 0; background: none; color: var(--accent); font-size: 11px; padding: 0; letter-spacing: 0; text-transform: none; display: none; }
aside h2 .clear.on { display: inline; margin-left: 8px; }
aside h2 .multi { float: right; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 10px; padding: 0 6px; border-radius: 8px; letter-spacing: 0; text-transform: none; }
.tagmode { display: none; margin: -2px 0 8px; font-size: 11px; background: var(--chip); border-radius: 8px; padding: 2px; width: max-content; }
.tagmode.on { display: flex; }
.tagmode button { border: 0; background: none; color: var(--muted); padding: 1px 10px; border-radius: 6px; font-size: 11px; }
.tagmode button.on { background: var(--panel); color: var(--ink); font-weight: 600; }
.srctags { display: flex; flex-wrap: wrap; gap: 4px; margin: -2px 0 8px; }
.srctags:empty { display: none; }
.stag { display: inline-block; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 0 7px; font-size: 11px; line-height: 17px; white-space: nowrap; }
.srctags .stag { cursor: pointer; font-size: 12px; line-height: 19px; padding: 0 8px; }
.srctags .stag:hover { border-color: var(--accent); color: var(--accent); }
.srctags .stag.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.item .name small { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.item.on .name small { color: inherit; opacity: .75; }
.card .src .stags { display: inline-flex; gap: 4px; flex-wrap: wrap; flex: none; align-self: flex-start; }
.ptagsug { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ptagsug button { border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 10px; padding: 0 8px; font-size: 12px; line-height: 20px; cursor: pointer; }
.ptagsug button:hover { border-color: var(--accent); color: var(--accent); }
aside h2 .multi.on { background: var(--accent); border-color: var(--accent); color: #fff; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; outline: none; }
.search:focus { border-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 1px; }
.item { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.item:hover { background: var(--chip); }
.item.on { background: var(--accent-soft); color: var(--accent); }
.item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.item .edit { opacity: 0; border: 0; background: none; color: var(--muted); padding: 0 2px; }
.item:hover .edit { opacity: 1; }
.tagcloud { display: flex; flex-wrap: wrap; gap: 4px; }
.tagcloud .chip { cursor: pointer; position: relative; }
.tagcloud .chip .ed { display: none; margin-left: 4px; color: var(--muted); }
.tagcloud .chip:hover .ed { display: inline; }
.tagcloud .chip .ed:hover { color: var(--accent); }
.card .tags .chip { position: relative; }
.card .tags .chip .x { display: none; margin-left: 3px; color: var(--muted); cursor: pointer; }
.card:hover .tags .chip .x { display: inline; }
.card .tags .chip .x:hover { color: var(--accent); }
.card .tags .addtag { opacity: 0; border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 10px; padding: 0 8px; font-size: 12px; }
.card:hover .tags .addtag { opacity: 1; }
.card .tags input.tagin { border: 1px solid var(--accent); border-radius: 10px; padding: 0 8px; font: 12px inherit; font-family: inherit; width: 110px; background: var(--bg); color: var(--ink); outline: none; }
.chip { background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; color: var(--ink); }
.chip.on { background: var(--accent); color: #fff; }
main { padding: 20px 28px 60px; min-width: 0; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 4px 12px; border-radius: 6px; font-size: 13px; }
.seg button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
.bar .sp { flex: 1; }
.seg button[draggable="true"] { cursor: grab; }
.seg button.dragging { opacity: .4; }
.seg button.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
.seg button.drop-after { box-shadow: inset -2px 0 0 var(--accent); }
.bar .count { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.grid { --cw: 320px; --gh: 380px; }
/* 页面末尾留白：让最后一组卡片也能被方向键滚到顶端 */
body:not(.quad-mode) .grid::after { content: ''; display: block; height: 60vh; }
.grid.size-s { --cw: 240px; --gh: 300px; } .grid.size-l { --cw: 440px; --gh: 500px; }
.group { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 12px; font: 600 15px/1.3 Georgia, "Songti SC", serif; }
.group:first-child { margin-top: 0; }
.group .n { font: 12px -apple-system, sans-serif; color: var(--muted); }
.masonry { display: flex; gap: 16px; align-items: flex-start; }
body.quad-mode main { height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; overflow: hidden; }
body.quad-mode .grid { flex: 1; min-height: 0; }
.quad { height: 100%; display: flex; }
.qcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex-grow: 0; flex-shrink: 0; }
.qcol[data-side=right] { flex-grow: 1; flex-shrink: 1; }
.qcell { min-height: 0; display: flex; flex-grow: 0; flex-shrink: 0; }
.qcell:last-child { flex-grow: 1; flex-shrink: 1; }
.qcell .pane { flex: 1; }
.qsplit { flex: none; position: relative; z-index: 2; }
.qsplit.v { width: 14px; cursor: col-resize; }
.qsplit.h { height: 14px; cursor: row-resize; }
.qsplit::after { content: ''; position: absolute; border-radius: 2px; background: var(--accent); opacity: 0; transition: opacity .15s; }
.qsplit.v::after { left: 6px; width: 2px; top: 0; bottom: 0; }
.qsplit.h::after { top: 6px; height: 2px; left: 0; right: 0; }
.qsplit:hover::after, .qsplit.drag::after { opacity: .6; }
.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: rgba(0,0,0,.025); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pane[data-t=quote] { --t: var(--quote); } .pane[data-t=figure] { --t: var(--figure); }
.pane[data-t=data] { --t: var(--data); } .pane[data-t=idea] { --t: var(--idea); }
.pane header { display: flex; align-items: baseline; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); border-top: 3px solid var(--t); background: var(--panel); }
.pane header .type { color: var(--t); font-weight: 700; } .pane header .n { color: var(--muted); font-size: 12px; }
.pane.focus { box-shadow: 0 0 0 2px var(--t); }
.pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; overscroll-behavior: contain; }
.pane header .pager { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.pane header .pager button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 0 8px; line-height: 20px; font-size: 13px; }
.pane header .pager button:hover { border-color: var(--t); color: var(--t); }
.pane header .pager .pg { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.pane header .pager .pmode { font-size: 11px; margin-left: 6px; color: var(--muted); }
.pane header .pager .pmode.on { color: var(--t); border-color: var(--t); }
.pbody.h { display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; align-items: stretch; }
.pbody.h .hcell { flex: 0 0 calc((100% - (var(--hn, 1) - 1) * 12px) / var(--hn, 1)); max-height: 100%; overflow-y: auto; scroll-snap-align: start; overscroll-behavior: contain; }
.pbody.h .hcell .card { margin: 0; }
.card.cur { box-shadow: 0 0 0 2px var(--t), 0 6px 18px rgba(0,0,0,.08); }
.pane.active header { background: linear-gradient(var(--panel), var(--panel)), var(--t); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--t) 35%, transparent); }
.pempty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 13px; }
@media (max-width: 760px) { body.quad-mode main { height: auto; overflow: visible; } .quad, .qcol { display: block; } .qsplit { display: none; } .qcell { display: block; margin-bottom: 14px; } .pane { height: 70vh; } }
.masonry .col { flex: 1; min-width: 0; }
.gridl { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 16px; }
.gridl .card { margin: 0; height: var(--gh); display: flex; flex-direction: column; }
.gridl .card .body { flex: 1; min-height: 0; overflow: hidden; mask-image: linear-gradient(#000 85%, transparent); }
.gridl .card img { max-height: calc(var(--gh) * 0.55); object-fit: contain; }
.gridl .card .content.long { max-height: none; mask-image: none; }
.masonry .card .body > img + .txt, .gridl .card .body > img + .txt { margin-top: 8px; }
.listl { display: flex; flex-direction: column; gap: 12px; max-width: 1100px; }
.listl .card { margin: 0; }
.listl .card .body { display: flex; gap: 16px; align-items: flex-start; }
.listl .card .body > img { width: var(--cw); flex: none; }
.listl .card .txt { flex: 1; min-width: 0; }
.listl .card .txt > .note:first-child, .listl .card .txt > .content:first-child { margin-top: 0; }
.bar select { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 13px; }
.bar .lbl { font-size: 12px; color: var(--muted); }
.card { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px;
        margin-bottom: 16px; position: relative; border-top: 3px solid var(--t); }
.card[data-t=quote] { --t: var(--quote); } .card[data-t=figure] { --t: var(--figure); }
.card[data-t=data] { --t: var(--data); } .card[data-t=idea] { --t: var(--idea); }
.card .head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.card .type { color: var(--t); font-weight: 700; letter-spacing: .5px; }
.card .head .type { flex: none; white-space: nowrap; }
.card .head > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card .acts { position: absolute; right: 10px; top: 9px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; background: var(--panel); border-radius: 6px; }
.card:hover .acts { opacity: 1; }
.card .acts button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 5px; border-radius: 4px; }
.card .acts button:hover { background: var(--chip); color: var(--ink); }
.card .content { font: 14.5px/1.6 Georgia, "Songti SC", serif; white-space: pre-wrap; word-break: break-word; }
.card[data-t=data] .content { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 14px; }
.card .content.long { max-height: 260px; overflow: hidden; mask-image: linear-gradient(#000 75%, transparent); }
.card img { display: block; width: 100%; height: auto; border-radius: 6px; cursor: zoom-in; background: #fff; }
.card .note { margin-top: 8px; font-size: 13px; color: var(--ink); background: var(--chip); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; cursor: text; }
.card .note:hover { outline: 1px solid var(--line); }
.card .note.add { background: none; color: var(--muted); padding: 2px 0; opacity: 0; }
.card:hover .note.add { opacity: 1; }
.card .content { cursor: text; }
.card .content mark { color: inherit; border-radius: 2px; padding: 0 1px; }
.hl-yellow { background: rgba(255, 212, 0, .5); } .hl-red { background: rgba(255, 102, 102, .45); }
.hl-green { background: rgba(95, 178, 54, .42); } .hl-blue { background: rgba(46, 168, 229, .42); } .hl-purple { background: rgba(162, 138, 229, .45); }
.card .content u { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
#hlbar { position: fixed; z-index: 20; display: none; align-items: center; gap: 4px; padding: 5px 7px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
#hlbar.on { display: flex; }
#hlbar button { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--ink); font-size: 13px; cursor: pointer; padding: 0; }
#hlbar button[data-hl] { background: var(--c); border-radius: 50%; width: 20px; height: 20px; margin: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
#hlbar button:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
#hlbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
.card .content:hover { outline: 1px solid var(--line); outline-offset: 3px; border-radius: 3px; }
.card textarea.note-edit.content-edit { font: 14.5px/1.6 Georgia, "Songti SC", serif; margin-top: 0; max-height: 60vh; }
.card textarea.note-edit { display: block; width: 100%; margin-top: 8px; font: 13px/1.5 inherit; font-family: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 60px; outline: none; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.card .src { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 6px; }
.card .src a { color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .src a:hover { color: var(--accent); }
.card .src .nosrc { color: var(--accent); cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 80px 20px; line-height: 2; }
.empty kbd, .help kbd { background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, monospace; }
.help { font-size: 12px; color: var(--muted); line-height: 2; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 20px; width: min(560px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h3 { margin: 0 0 14px; font-size: 16px; }
dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
dialog input, dialog textarea, dialog select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
dialog textarea { resize: vertical; min-height: 70px; }
dialog .row { display: flex; gap: 10px; } dialog .row > * { flex: 1; }
dialog .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
dialog img { max-width: 100%; max-height: 220px; display: block; margin: 0 auto; border-radius: 6px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
.lightbox.on { display: flex; } .lightbox img { max-width: 94vw; max-height: 94vh; background: #fff; border-radius: 6px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 760px) { .listl .card .body { flex-direction: column; } .listl .card .body > img { width: 100%; } }
@media (max-width: 760px) { .resizer { display: none; } .app { grid-template-columns: 1fr; } aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 16px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Paper<span>Cards</span></h1>
    <input class="search" id="q" placeholder="搜索内容、备注、标签、论文…">
    <h2>来源 <button class="clear" id="clearSel" title="清除来源筛选">全部</button><button class="multi" id="multiSel" title="开启后点击可同时选多个来源（单选模式下 ⌘ 点击也可多选）">多选</button></h2>
    <div class="srctags" id="srcTags"></div>
    <div class="list" id="papers"></div>
    <h2>标签 <button class="clear" id="clearTag" title="清除标签筛选"></button><button class="multi" id="tagMultiBtn" title="开启后点击可同时选多个标签（单选模式下 ⌘ 点击也可多选）">多选</button></h2>
    <div class="tagmode" id="tagMode"><button data-m="any">任一</button><button data-m="all">全部</button></div>
    <div class="tagcloud" id="tags"></div>
    <h2>快捷键</h2>
    <div class="help">
      <kbd>⌃⌥⌘C</kbd> 收集选中文字<br>
      <kbd>⌃⌥⌘S</kbd> 截图收集图表<br>
      <kbd>⌃⌥⌘R</kbd> 按上次区域一键截图<br>
      <kbd>⌃⌥⌘A</kbd> 自动截图（换页就截）<br>
      <kbd>⌃⌥⌘V</kbd> 收集剪贴板（Snipaste 截图后）<br>
      <kbd>⌃⌥⌘P</kbd> 打开卡片墙<br>
      在本页 <kbd>⌘V</kbd> 粘贴图片/文字新建<br>
      <kbd>← →</kbd> 上一张 / 下一张卡片<br>
      <kbd>⌥← ⌥→</kbd> 切换到上一个 / 下一个类型
    </div>
  </aside>
  <div class="resizer" id="resizer" title="拖动调整左栏宽度，双击恢复默认"></div>
  <main>
    <div class="bar">
      <div class="seg" id="types"></div>
      <span class="count" id="count"></span>
      <select id="group" title="分组">
        <option value="">不分组</option><option value="paper">按来源分组</option><option value="type">按类型分组</option>
      </select>
      <select id="sort" title="排序">
        <option value="new">最新在前</option><option value="old">最早在前</option>
      </select>
      <div class="seg" id="layout"></div>
      <button class="btn" id="quadReset" title="四个区恢复平分，并全部切回上下滚动" style="display:none">重置布局</button>
      <div class="seg" id="size"></div>
      <span class="sp"></span>
      <button class="btn" id="exportBtn">导出 Markdown（zip）</button>
      <button class="btn primary" id="newBtn">+ 新卡片</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<dialog id="cardDlg">
  <h3 id="cardDlgTitle">编辑卡片</h3>
  <div id="dImg"></div>
  <div class="row">
    <div><label>类型</label><select id="dType"></select></div>
    <div><label>页码</label><input id="dPage"></div>
  </div>
  <label>内容</label><textarea id="dContent"></textarea>
  <label>备注</label><textarea id="dNote" style="min-height:50px"></textarea>
  <label>标签（逗号分隔）</label><input id="dTags" list="tagSuggest">
  <label>来源</label>
  <select id="dPaperSel"></select>
  <input id="dPaperNew" placeholder="输入 DOI / arXiv 号 / 链接（自动识别），或直接写标题" style="display:none;margin-top:6px">

<dialog id="paperDlg">
  <h3>编辑来源信息</h3>
  <label>标题</label><input id="pTitle">
  <label>作者（逗号分隔）</label><input id="pAuthors">
  <div class="row"><div><label>年份</label><input id="pYear"></div><div><label>会议/期刊</label><input id="pVenue"></div></div>
  <label>DOI</label><input id="pDoi">
  <label>链接</label><input id="pUrl">
  <label>来源标签（逗号分隔，如会议、团队、机构）</label><input id="pTags" list="srcTagSuggest" placeholder="例如：NeurIPS, Google Brain">
  <datalist id="srcTagSuggest"></datalist>
  <div class="ptagsug" id="pTagSug"></div>

</dialog>

<datalist id="tagSuggest"></datalist>
<div class="lightbox" id="lightbox"><img></div>
<div class="toast" id="toast"></div>

<script src="/static/annot.js"></script>
<script>
const TYPES = { quote: '摘录', figure: '图表', data: '数据', idea: '想法' };
// 类型的显示顺序：默认想法在前，可在顶部按钮上拖动调整（记在浏览器里）
let typeOrder = ['idea', 'quote', 'figure', 'data'];
try {
  const saved = JSON.parse(localStorage.getItem('papercards.typeOrder') || 'null');
  if (Array.isArray(saved) && saved.length === 4 && saved.every(k => k in TYPES)) typeOrder = saved;
} catch (e) {}
const orderedTypes = () => typeOrder.map(k => [k, TYPES[k]]);
function saveTypeOrder() { try { localStorage.setItem('papercards.typeOrder', JSON.stringify(typeOrder)); } catch (e) {} }
const S = { cards: [], papers: [], tags: [], type: '', sel: new Set(), srcTagSel: new Set(), tagSel: new Set(), tagMulti: false, tagAll: false, paneMode: {}, quadRatio: { col: 50, left: 50, right: 50 }, q: '', sort: 'new', group: '', multi: false, layout: 'masonry', size: 'm' };
const LAYOUTS = { masonry: '瀑布流', grid: '网格', list: '列表', quad: '四分' };
const SIZES = { s: '小', m: '中', l: '大' };
try { Object.assign(S, JSON.parse(localStorage.getItem('papercards.view') || '{}')); } catch (e) {}
for (const [k, v] of new URLSearchParams(location.search)) if (['sort', 'group', 'layout', 'size'].includes(k)) S[k] = v;
if (S.sort === 'paper' || S.sort === 'type') { S.group = S.sort; S.sort = 'new'; }   // 兼容旧的保存值
// URL 里还可以带：sources=1,2（来源 id）、stags=a,b（来源标签）、tags=a,b（标签）、h=figure,data（这些四分区用左右翻页）、q=60,70,40（四分比例：左列宽%、左列上区高%、右列上区高%）
{
  const u = new URLSearchParams(location.search);
  if (u.get('sources')) S.sel = new Set(u.get('sources').split(',').map(Number));
  if (u.get('tags')) S.tagSel = new Set(u.get('tags').split(','));
  if (u.get('stags')) S.srcTagSel = new Set(u.get('stags').split(','));
  if (u.get('q')) { const [col, left, right] = u.get('q').split(',').map(Number); S.quadRatio = { col: col || 50, left: left || 50, right: right || 50 }; }
  if (u.get('h')) u.get('h').split(',').forEach(k => { S.paneMode = { ...S.paneMode, [k]: 'h' }; });
}
function saveView() { try { localStorage.setItem('papercards.view', JSON.stringify({ quadRatio: S.quadRatio, tagMulti: S.tagMulti, tagAll: S.tagAll, paneMode: S.paneMode, multi: S.multi, sort: S.sort, group: S.group, layout: S.layout, size: S.size })); } catch (e) {} }
const $ = s => document.getElementById(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = (p, o = {}) => fetch(p, { headers: { 'Content-Type': 'application/json' }, ...o }).then(r => r.json());
const last = s => s.trim().split(/\s+/).pop();
function cite(p) {
  if (!p) return '';
  const a = p.authors || [];
  const who = a.length ? last(a[0]) + (a.length > 2 ? ' et al.' : a.length === 2 ? ' & ' + last(a[1]) : '') : '';
  return [who, p.year].filter(Boolean).join(', ');
}
function fmtTime(t) {
  const d = new Date(t * 1000), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1600); }
function srcLink(c) {
  const p = c.paper;
  const lib = (p && p.zotero_lib) || 'library';
  if (c.att_key) return `zotero://open-pdf/${lib}/items/${c.att_key}${c.page ? '?page=' + c.page : ''}`;
  if (c.src_url) return c.src_url;
  if (p && p.zotero_key) return `zotero://select/${lib}/items/${p.zotero_key}`;
  return p && p.url;
}

// 数据没变化时不重画（避免自动刷新打断滚动、编辑等操作）
let lastSnap = '';
async function load(force) {
  const r = await Promise.all([api('/api/cards'), api('/api/papers'), api('/api/tags')]);
  const snap = JSON.stringify(r);
  if (!force && snap === lastSnap) return;
  lastSnap = snap;
  [S.cards, S.papers, S.tags] = r;
  render();
}
// 来源筛选：所选来源 + 所选来源标签（任一）
function inSources(c) {
  if (S.sel.size && !S.sel.has(c.paper_id || 0)) return false;
  if (S.srcTagSel.size && !(c.paper && (c.paper.tags || []).some(t => S.srcTagSel.has(t)))) return false;
  return true;
}
function filtered(ignoreType) {
  const q = S.q.toLowerCase();
  return S.cards.filter(c =>
    (ignoreType || !S.type || c.type === S.type) &&
    inSources(c) &&
    (!S.tagSel.size || (S.tagAll ? [...S.tagSel].every(t => c.tags.includes(t)) : c.tags.some(t => S.tagSel.has(t)))) &&
    (!q || [c.content, c.note, c.tags.join(' '), c.paper && c.paper.title, c.paper && c.paper.authors.join(' ')].join(' ').toLowerCase().includes(q)));
}
function render() {
  $('types').innerHTML = [['', '全部'], ...orderedTypes()].map(([k, v]) =>
    `<button data-k="${k}" class="${S.type === k ? 'on' : ''}" ${k ? 'draggable="true" title="拖动调整顺序"' : ''}>${v}</button>`).join('');
  $('types').querySelectorAll('button').forEach(b => b.onclick = () => { S.type = b.dataset.k; render(); });
  $('dType').innerHTML = orderedTypes().map(([k, v]) => `<option value="${k}">${v}</option>`).join('');

  const unsorted = S.cards.filter(c => !c.paper_id).length;
  const srcTagCount = new Map();
  S.papers.filter(p => p.n).forEach(p => (p.tags || []).forEach(t => srcTagCount.set(t, (srcTagCount.get(t) || 0) + 1)));
  S.srcTagSel.forEach(t => { if (!srcTagCount.has(t)) srcTagCount.set(t, 0); });
  $('srcTags').innerHTML = [...srcTagCount].sort((a, b) => b[1] - a[1]).map(([t, n]) =>
    `<span class="stag ${S.srcTagSel.has(t) ? 'on' : ''}" data-st="${esc(t)}" title="只看带此标签的来源（⌘ 点击多选）">${esc(t)} ${n}</span>`).join('');
  $('srcTags').querySelectorAll('.stag').forEach(el => el.onclick = e => {
    const t = el.dataset.st;
    if (S.multi || e.metaKey) S.srcTagSel.has(t) ? S.srcTagSel.delete(t) : S.srcTagSel.add(t);
    else if (S.srcTagSel.size === 1 && S.srcTagSel.has(t)) S.srcTagSel.clear();
    else S.srcTagSel = new Set([t]);
    render();
  });
  const showPaper = p => p.n && (!S.srcTagSel.size || (p.tags || []).some(t => S.srcTagSel.has(t)) || S.sel.has(p.id));
  $('papers').innerHTML = S.papers.filter(showPaper).map(p =>
    `<div class="item ${S.sel.has(p.id) ? 'on' : ''}" data-id="${p.id}" title="${esc(p.title)}${(p.tags || []).length ? '\n' + esc(p.tags.join(' · ')) : ''}">
       <span class="name">${esc(p.title)}${(p.tags || []).length ? `<small>${esc(p.tags.join(' · '))}</small>` : ''}</span><button class="edit" data-edit="${p.id}" title="编辑论文信息 / 来源标签">✎</button><span class="n">${p.n}</span></div>`).join('')
    + (unsorted && !S.srcTagSel.size ? `<div class="item ${S.sel.has(0) ? 'on' : ''}" data-id="0"><span class="name" style="color:var(--accent)">未标注来源</span><span class="n">${unsorted}</span></div>` : '');
  $('multiSel').classList.toggle('on', S.multi);
  $('clearSel').classList.toggle('on', S.sel.size > 1);   // 只有多选（选了不止一个）时才显示
  $('clearSel').textContent = `已选 ${S.sel.size} · 清除`;
  $('papers').querySelectorAll('.item').forEach(el => el.onclick = e => {
    if (e.target.dataset.edit) return editPaper(+e.target.dataset.edit);
    const id = +el.dataset.id;
    if (S.multi || e.metaKey) S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);   // 多选：切换
    else if (S.sel.size === 1 && S.sel.has(id)) S.sel.clear();                      // 单选：再点取消
    else S.sel = new Set([id]);                                                     // 单选：只选这个
    render();
  });
  // 标签列表只统计所选来源下的卡片；已选中的标签即使数量为 0 也保留，方便取消
  const counts = new Map();
  S.cards.filter(inSources)
    .forEach(c => c.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  S.tagSel.forEach(t => { if (!counts.has(t)) counts.set(t, 0); });
  const tagList = [...counts].sort((a, b) => b[1] - a[1]);
  $('tags').innerHTML = tagList.map(([t, n]) => `<span class="chip ${S.tagSel.has(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)} ${n}<span class="ed" title="重命名 / 合并 / 删除">✎</span></span>`).join('')
    || `<span class="help">${S.sel.size ? '所选来源下没有标签' : '还没有标签'}</span>`;
  $('tags').querySelectorAll('.chip').forEach(el => el.onclick = e => {
    if (e.target.classList.contains('ed')) return manageTag(el.dataset.t);
    const t = el.dataset.t;
    if (S.tagMulti || e.metaKey) S.tagSel.has(t) ? S.tagSel.delete(t) : S.tagSel.add(t);
    else if (S.tagSel.size === 1 && S.tagSel.has(t)) S.tagSel.clear();
    else S.tagSel = new Set([t]);
    render();
  });
  $('tagMultiBtn').classList.toggle('on', S.tagMulti);
  $('clearTag').classList.toggle('on', S.tagSel.size > 1);
  $('clearTag').textContent = `已选 ${S.tagSel.size} · 清除`;
  $('tagMode').classList.toggle('on', S.tagSel.size > 1);
  $('tagMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', (b.dataset.m === 'all') === S.tagAll));
  $('tagSuggest').innerHTML = S.tags.map(([t]) => `<option value="${esc(t)}">`).join('');
  $('dPaperSel').innerHTML = '<option value="">（无来源）</option>'
    + S.papers.map(p => `<option value="${p.id}">${esc(p.title)}${cite(p) ? ' — ' + esc(cite(p)) : ''}</option>`).join('')
    + '<option value="__new">＋ 新来源…</option>';

  const cards = filtered();
  $('count').textContent = `${cards.length} 张卡片`;
  $('sort').value = S.sort;
  $('group').value = S.group;
  $('layout').innerHTML = Object.entries(LAYOUTS).map(([k, v]) => `<button data-k="${k}" class="${S.layout === k ? 'on' : ''}">${v}</button>`).join('');
  $('size').innerHTML = Object.entries(SIZES).map(([k, v]) => `<button data-k="${k}" class="${S.size === k ? 'on' : ''}" title="卡片大小">${v}</button>`).join('');
  $('grid').className = 'grid size-' + S.size;
  if (!S.cards.length) {
    $('grid').innerHTML = `<div class="empty">还没有卡片。<br>在 Zotero 或 Chrome 里选中一段文字，按 <kbd>⌃⌥⌘C</kbd>；<br>想收集图表，按 <kbd>⌃⌥⌘S</kbd> 框选截图。</div>`;
    return;
  }
  document.body.classList.toggle('quad-mode', S.layout === 'quad');
  $('group').style.display = S.layout === 'quad' ? 'none' : '';   // 四分本身就是按类型分区
  $('quadReset').style.display = S.layout === 'quad' ? '' : 'none';
  if (S.layout === 'quad') return renderQuad();
  if (!cards.length) { $('grid').innerHTML = '<div class="empty">没有匹配的卡片</div>'; return; }
  const groups = groupCards(cards);
  navOrder = { all: groups.flatMap(g => g.cards.map(c => c.id)) };
  $('grid').innerHTML = groups.map(g =>
    (g.title ? `<div class="group">${esc(g.title)}<span class="n">${g.cards.length} 张</span></div>` : '') + layoutHTML(g.cards)).join('');
  markCurrent(Date.now() - navAt < 1500);
}

function sortCards(cards) {
  const byTime = (a, b) => S.sort === 'old' ? a.created_at - b.created_at : b.created_at - a.created_at;
  return [...cards].sort(byTime);
}
function groupCards(cards) {
  cards = sortCards(cards);
  if (S.group === 'paper') {
    const m = new Map();
    for (const c of cards) {
      const k = c.paper ? c.paper.title : '未标注来源';
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(c);
    }
    return [...m].sort((a, b) => (a[0] === '未标注来源') - (b[0] === '未标注来源')).map(([title, cards]) => ({ title, cards }));
  }
  if (S.group === 'type') {
    return orderedTypes().map(([k, v]) => ({ title: v, cards: cards.filter(c => c.type === k) })).filter(g => g.cards.length);
  }
  return [{ title: '', cards }];
}
// 四分布局：每种类型一个区，各自独立滚动；刷新时保留每个区的滚动位置
function renderQuad() {
  const keep = {};
  $('grid').querySelectorAll('.pbody').forEach(el => { keep[el.dataset.t] = [el.scrollTop, el.scrollLeft]; });
  const all = sortCards(filtered(true));
  $('count').textContent = `${all.length} 张卡片`;
  const R = S.quadRatio, ord = orderedTypes();
  navOrder = {};
  const paneHTML = ([k, v], w) => {
    const cs = all.filter(c => c.type === k);
    navOrder[k] = cs.map(c => c.id);
    const h = S.paneMode[k] === 'h';
    const body = !cs.length ? '<div class="pempty">暂无</div>'
      : h ? cs.map(c => `<div class="hcell">${cardHTML(c)}</div>`).join('') : masonryHTML(cs, w);
    return `<section class="pane ${S.type === k ? 'focus' : ''}" data-t="${k}">
      <header><span class="type">${v}</span><span class="n">${cs.length} 张</span>
        <span class="pager">${h ? `<button data-pg="-1" title="上一页">‹</button><span class="pg"></span><button data-pg="1" title="下一页">›</button>` : ''}
        <button class="pmode ${h ? 'on' : ''}" data-pmode="${k}" title="${h ? '切换为上下滚动' : '切换为左右翻页'}">${h ? '⇆ 左右' : '⇅ 上下'}</button></span></header>
      <div class="pbody ${h ? 'h' : ''}" data-t="${k}" ${h ? `data-n="${hPerPage(w)}" style="--hn:${hPerPage(w)}"` : ''}>${body}</div>
    </section>`;
  };
  const W = $('grid').clientWidth - 14, lw = W * R.col / 100 - 24, rw = W * (100 - R.col) / 100 - 24;
  // 布局：左列 = 第 1、3 个类型，右列 = 第 2、4 个类型
  $('grid').innerHTML = `<div class="quad">
    <div class="qcol" data-side="left" style="flex-basis:${R.col}%">
      <div class="qcell" style="flex-basis:${R.left}%">${paneHTML(ord[0], lw)}</div>
      <div class="qsplit h" data-split="left" title="拖动调整上下比例，双击恢复"></div>
      <div class="qcell" style="flex-basis:${100 - R.left}%">${paneHTML(ord[2], lw)}</div>
    </div>
    <div class="qsplit v" data-split="col" title="拖动调整左右比例，双击恢复"></div>
    <div class="qcol" data-side="right" style="flex-basis:${100 - R.col}%">
      <div class="qcell" style="flex-basis:${R.right}%">${paneHTML(ord[1], rw)}</div>
      <div class="qsplit h" data-split="right" title="拖动调整上下比例，双击恢复"></div>
      <div class="qcell" style="flex-basis:${100 - R.right}%">${paneHTML(ord[3], rw)}</div>
    </div></div>`;
  $('grid').querySelectorAll('.pbody').forEach(el => {
    const k = keep[el.dataset.t];
    if (k) { el.scrollTop = k[0]; el.scrollLeft = k[1]; }
    if (el.classList.contains('h')) { updatePager(el); el.addEventListener('scroll', () => updatePager(el), { passive: true }); }
  });
  $('grid').querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.t === activePane()));
  markCurrent(Date.now() - navAt < 1500);
}

// ---- 键盘 ← → 在卡片间切换（四分布局下作用于当前区：鼠标所在或最近点击的区）
let navOrder = {}, curCard = {}, activePaneKey = null, navAt = 0;
const activePane = () => activePaneKey || typeOrder[0];
const navKey = () => S.layout === 'quad' ? activePane() : 'all';
function markCurrent(scroll) {
  if (scroll) navAt = navAt || Date.now();
  $('grid').querySelectorAll('.card.cur').forEach(el => el.classList.remove('cur'));
  const key = navKey(), id = curCard[key];
  if (!id) return;
  const scope = S.layout === 'quad' ? $('grid').querySelector(`.pane[data-t="${key}"]`) : $('grid');
  const el = scope && scope.querySelector(`.card[data-id="${id}"]`);
  if (!el) return;
  el.classList.add('cur');
  if (scroll) scrollCardToTop(el);
}
// 把卡片贴到所在区（或页面）的顶端；左右翻页的区则贴到最左边
let settleTimer;
function scrollCardToTop(el) {
  doScrollCardToTop(el);
  clearInterval(settleTimer);
  let lastTop = el.getBoundingClientRect().top, ticks = 0;
  settleTimer = setInterval(() => {
    const t = el.isConnected ? el.getBoundingClientRect().top : null;
    if (t === null || ++ticks > 8) return clearInterval(settleTimer);
    if (Math.abs(t - lastTop) < 1 && ticks > 2) {          // 滚动已停下
      const want = el.closest('.pbody') ? null : 60;
      if (want !== null && (t < 0 || t > window.innerHeight * 0.5)) doScrollCardToTop(el);   // 停的位置不对，再对准
      return clearInterval(settleTimer);
    }
    lastTop = t;
  }, 200);
}
function doScrollCardToTop(el) {
  const body = el.closest('.pbody'), r = el.getBoundingClientRect();
  if (body && body.classList.contains('h')) {
    const cell = el.closest('.hcell'), br = body.getBoundingClientRect();
    body.scrollTo({ left: body.scrollLeft + cell.getBoundingClientRect().left - br.left - 12, behavior: 'smooth' });
    cell.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (body) {
    body.scrollTo({ top: body.scrollTop + r.top - body.getBoundingClientRect().top - 12, behavior: 'smooth' });
  } else {
    // 卡片在分组第一行时，连同上方的分组标题一起露出来
    const cont = el.closest('.masonry, .gridl, .listl'), head = cont && cont.previousElementSibling;
    const firstRow = cont && r.top - cont.getBoundingClientRect().top < 40;
    const top = head && head.classList.contains('group') && firstRow ? head.getBoundingClientRect().top - 12 : r.top - 16;
    window.scrollTo({ top: window.scrollY + top, behavior: 'smooth' });
  }
}
function setActivePane(k) {
  if (S.layout !== 'quad' || k === activePaneKey) return;
  activePaneKey = k;
  $('grid').querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.t === k));
  markCurrent(false);
}
$('grid').addEventListener('mouseover', e => { const p = e.target.closest('.pane'); if (p) setActivePane(p.dataset.t); });
$('grid').addEventListener('mousedown', e => {
  const p = e.target.closest('.pane'); if (p) setActivePane(p.dataset.t);
  const c = e.target.closest('.card');   // 点卡片即设为当前卡片
  if (c) { curCard[navKey()] = +c.dataset.id; markCurrent(false); }
});
// ⌥← / ⌥→：切到上一个 / 下一个类型的第一张卡片（按类型顺序循环，跳过没有卡片的类型）
function jumpType(dir) {
  const cardType = id => (S.cards.find(c => c.id === id) || {}).type;
  if (S.layout === 'quad') {
    const has = typeOrder.filter(k => (navOrder[k] || []).length);
    if (!has.length) return;
    let i = typeOrder.indexOf(activePane());
    for (let step = 0; step < typeOrder.length; step++) {
      i = (i + dir + typeOrder.length) % typeOrder.length;
      if ((navOrder[typeOrder[i]] || []).length) break;
    }
    const k = typeOrder[i];
    activePaneKey = null; setActivePane(k);
    curCard[k] = navOrder[k][0];
    markCurrent(true);
  } else {
    const ids = navOrder.all || [];
    if (!ids.length) return;
    const curT = cardType(curCard.all) || cardType(ids[0]);
    let i = typeOrder.indexOf(curT);
    for (let step = 0; step < typeOrder.length; step++) {
      i = (i + dir + typeOrder.length) % typeOrder.length;
      const first = ids.find(id => cardType(id) === typeOrder[i]);
      if (first) { curCard.all = first; break; }
    }
    markCurrent(true);
  }

// ---- 文字高亮 / 下划线（参照 Zotero）
// 存储标记：=={color}文字==（不写颜色为黄色）、++文字++（下划线），可嵌套：=={red}++文字++==
const HL = { yellow: '#ffd400', red: '#ff6666', green: '#5fb236', blue: '#2ea8e5', purple: '#a28ae5' };
function parseRich(raw) {
  const segs = []; let hl = null, ul = false, last = 0, m;

}
function serializeRich(segs) {
  const out = [];
  segs.forEach(s => {
    const prev = out[out.length - 1];
    if (prev && prev.hl === s.hl && prev.ul === s.ul) prev.text += s.text; else out.push({ ...s });
  });
  return out.map(s => (s.hl ? (s.hl === 'yellow' ? '==' : `=={${s.hl}}`) : '') + (s.ul ? '++' : '') + s.text + (s.ul ? '++' : '') + (s.hl ? '==' : '')).join('');
}

function richHTML(raw) {

    if (s.hl) h = `<mark class="hl-${s.hl}">${h}</mark>`;

}
function richMarkdown(raw) {   // 复制 / 导出用：带颜色的 <mark> 和 <u>
  return parseRich(raw).map(s => {

function applyRich(raw, a, b, fmt) {
  const segs = []; let pos = 0;
  parseRich(raw).forEach(s => {
    const end = pos + s.text.length;
    [[pos, Math.min(end, a)], [Math.max(pos, a), Math.min(end, b)], [Math.max(pos, b), end]].forEach(([x, y], i) => {
      if (y > x) segs.push({ ...s, text: s.text.slice(x - pos, y - pos), sel: i === 1 });
    });
    pos = end;
  });
  const inSel = segs.filter(s => s.sel);
  if (fmt.hl !== undefined) {
    const off = fmt.hl && inSel.every(s => s.hl === fmt.hl);
    inSel.forEach(s => { s.hl = off ? null : fmt.hl; });
  }
  if (fmt.ul) { const off = inSel.every(s => s.ul); inSel.forEach(s => { s.ul = !off; }); }
  if (fmt.clear) inSel.forEach(s => { s.hl = null; s.ul = false; });

}

function addTagInline(btn, c) {
  const inp = document.createElement('input');
  inp.className = 'tagin'; inp.setAttribute('list', 'tagSuggest'); inp.placeholder = '标签，回车添加';
  btn.replaceWith(inp); inp.focus();

  inp.addEventListener('keydown', async e => {

      const v = inp.value.trim().replace(/^#/, '');

// 左栏管理标签：重命名（改成已有名字即合并）或从所有卡片删除
async function manageTag(t) {
  const v = prompt(`重命名标签「${t}」（改成已有的标签名会合并）\n留空并确定 = 从所有卡片中删除这个标签`, t);
  if (v === null) return;
  const nv = v.trim().replace(/^#/, '');
  if (nv === t) return;
  if (!nv) {
    if (!confirm(`从所有卡片中删除标签「${t}」？卡片本身不会删除。`)) return;
    await api('/api/tags/delete', { method: 'POST', body: JSON.stringify({ old: t }) });
    S.tagSel.delete(t);
  } else {
    await api('/api/tags/rename', { method: 'POST', body: JSON.stringify({ old: t, new: nv }) });
    if (S.tagSel.delete(t)) S.tagSel.add(nv);
  }
  toast('标签已更新'); load();
}

$('lightbox').onclick = () => $('lightbox').classList.remove('on');
$('q').oninput = e => { S.q = e.target.value; render(); };

// ---- 卡片编辑 / 新建
let editing = null;
function openCard(c) {
  // 手动新建默认用当前筛选的类型，没筛选时默认「想法」
  editing = c || { type: S.type || 'idea', content: '', note: '', tags: [], paper: null };
  $('cardDlgTitle').textContent = c && c.id ? '编辑卡片' : '新卡片';
  $('dImg').innerHTML = editing.image ? `<img src="/images/${editing.image}">` : '';
  $('dType').value = editing.type;
  $('dPage').value = editing.page || '';
  $('dContent').value = editing.content || '';
  $('dNote').value = editing.note || '';
  $('dTags').value = editing.tags.join(', ');
  const pid = editing.paper ? editing.paper.id : (S.sel.size === 1 ? [...S.sel][0] : '');
  $('dPaperSel').value = pid ? String(pid) : '';
  $('dPaperNew').value = '';
  $('dPaperNew').style.display = 'none';
  $('cardDlg').showModal();
  (editing.image || editing.content ? $('dNote') : $('dContent')).focus();
}
$('dCancel').onclick = () => $('cardDlg').close();
$('dSave').onclick = async () => {
  const body = {
    type: $('dType').value, page: $('dPage').value.trim() || null, content: $('dContent').value,
    note: $('dNote').value.trim(), tags: $('dTags').value.split(/[,，]/).map(s => s.trim().replace(/^#/, '')).filter(Boolean),
    image: editing.image || null,
  };
  const sel = $('dPaperSel').value, ptxt = $('dPaperNew').value.trim();
  if (sel !== '__new') body.paper_id = sel ? +sel : null;
  else if (ptxt) {
    $('dSave').textContent = '识别来源…';
    const m = /^(10\.|https?:|arxiv:|\d{4}\.\d{4,5})/i.test(ptxt) ? await api('/api/lookup?q=' + encodeURIComponent(ptxt)) : null;
    body.paper = m && m.title ? m : { title: ptxt };
    $('dSave').textContent = '保存';
  }
  const saved = editing.id
    ? await api('/api/cards/' + editing.id, { method: 'PUT', body: JSON.stringify(body) })
    : await api('/api/cards', { method: 'POST', body: JSON.stringify(body) });
  $('cardDlg').close();
  await load();
  if (saved && saved.id && !filtered().some(c => c.id === saved.id)) toast('已保存，但被当前筛选条件隐藏了');
  else toast('已保存');
};
$('newBtn').onclick = () => openCard();
$('dPaperSel').onchange = () => {
  const isNew = $('dPaperSel').value === '__new';
  $('dPaperNew').style.display = isNew ? '' : 'none';
  if (isNew) $('dPaperNew').focus();
};

// 在卡片墙上直接粘贴图片或文字
document.addEventListener('paste', async e => {
  if (e.target.closest('input, textarea') || $('cardDlg').open) return;
  const items = [...e.clipboardData.items];
  const img = items.find(i => i.type.startsWith('image/'));
  if (img) {
    const r = await fetch('/api/upload', { method: 'POST', body: img.getAsFile() }).then(r => r.json());
    openCard({ type: 'figure', content: '', note: '', tags: [], image: r.image, paper: null });
  } else {
    const text = e.clipboardData.getData('text/plain');
    if (text) openCard({ type: 'quote', content: text, note: '', tags: [], paper: null });
  }
});

// ---- 论文编辑
let paperEditing = null;
function editPaper(id) {
  const p = paperEditing = S.papers.find(p => p.id === id);
  $('pTitle').value = p.title || ''; $('pAuthors').value = (p.authors || []).join(', ');
  $('pYear').value = p.year || ''; $('pVenue').value = p.venue || ''; $('pDoi').value = p.doi || ''; $('pUrl').value = p.url || '';
  $('pTags').value = (p.tags || []).join(', ');
  // 建议：会议简称（取括号里的缩写或较短的会议名）+ 常用的已有来源标签
  const all = new Map();
  S.papers.forEach(x => (x.tags || []).forEach(t => all.set(t, (all.get(t) || 0) + 1)));
  $('srcTagSuggest').innerHTML = [...all.keys()].map(t => `<option value="${esc(t)}">`).join('');
  const venue = (p.venue || '').match(/\(([A-Za-z][\w-]{1,15})\)/)?.[1] || ((p.venue || '').length <= 20 ? p.venue : '');
  const sug = [venue, ...[...all].sort((a, b) => b[1] - a[1]).map(([t]) => t)].filter(t => t && !(p.tags || []).includes(t));
  $('pTagSug').innerHTML = [...new Set(sug)].slice(0, 8).map(t => `<button type="button" data-t="${esc(t)}">＋${esc(t)}</button>`).join('');
  $('paperDlg').showModal();
}
$('pCancel').onclick = () => $('paperDlg').close();
$('pTagSug').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  const cur = $('pTags').value.split(/[,，]/).map(x => x.trim()).filter(Boolean);
  if (!cur.includes(t)) cur.push(t);
  $('pTags').value = cur.join(', '); e.target.remove();
};
$('pSave').onclick = async () => {
  await api('/api/papers/' + paperEditing.id, { method: 'PUT', body: JSON.stringify({
    title: $('pTitle').value.trim(), authors: $('pAuthors').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    year: $('pYear').value.trim(), venue: $('pVenue').value.trim(), doi: $('pDoi').value.trim(), url: $('pUrl').value.trim(),
    tags: [...new Set($('pTags').value.split(/[,，]/).map(x => x.trim()).filter(Boolean))] }) });
  $('paperDlg').close(); load();
};
$('pBib').onclick = async () => {
  const t = await fetch(`/api/papers/${paperEditing.id}/bibtex`).then(r => r.text());
  await navigator.clipboard.writeText(t); toast('BibTeX 已复制');
};

// 导出：按页面当前的显示顺序和分组方式
$('exportBtn').onclick = () => {
  const quad = S.layout === 'quad';
  const ids = quad ? typeOrder.flatMap(k => navOrder[k] || []) : (navOrder.all || []);
  if (!ids.length) return toast('没有可导出的卡片');
  const mode = quad || S.group === 'type' ? 'type' : S.group === 'paper' ? 'paper' : 'flat';
  location.href = `/api/export?ids=${ids.join(',')}&mode=${mode}&types=${typeOrder.join(',')}`;
};

load();
window.addEventListener('focus', () => { if (!document.querySelector('dialog[open], .note-edit, .tagin')) load(); });
setInterval(() => { if (!document.hidden && !document.querySelector('dialog[open], .note-edit, .tagin')) load(); }, 5000);
</script>
</body>
</html>
